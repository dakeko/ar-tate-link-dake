<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>喋る名刺 | ダケキヨミ</title>
  <link rel="preconnect" href="https://aframe.io">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; overflow: hidden; background: #000; }

    /* 読み込み・カメラ準備中のオーバーレイ（a-sceneの外に置くのが重要） */
    #loading {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #111; color: #fff;
      font-family: sans-serif; text-align: center;
      padding: 24px; line-height: 1.9;
      transition: opacity 0.4s ease;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    #loading .intro { font-size: 18px; font-weight: bold; margin-bottom: 32px; }
    #loading .msg   { font-size: 14px; opacity: 0.7; }

    /* 音声オン用ボタン（タップ後は表示しない） */
    #sound-button {
      position: fixed; bottom: 26%; left: 50%;
      transform: translateX(-50%);
      z-index: 999; display: none;
      padding: 14px 24px; border: none; border-radius: 28px;
      background: rgba(0,0,0,0.7); color: #fff;
      font-size: 16px; font-weight: bold;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #link-buttons {
      position: fixed; bottom: 12%; left: 50%;
      transform: translateX(-50%);
      z-index: 999; display: none; gap: 20px; flex-direction: row;
    }
    #link-buttons img { width: 60px; height: 60px; cursor: pointer; }
なるほど、了解です。
    /* 検証用。原因が判明したら display:none にしてください */
    #debug {
      position: fixed; bottom: 4px; left: 4px; z-index: 1001;
      font-family: monospace; font-size: 11px; color: #0f0;
      background: rgba(0,0,0,0.6); padding: 4px 6px;
      max-width: 90vw; word-break: break-all;
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="intro">
      ダケキヨミです！<br>
      WebとAIで日々の作業を<br>
      ラクにするお手伝いをします
    </div>
    <div class="msg">
      カメラを準備しています…<br>
      準備ができたら名刺をかざしてください
    </div>
  </div>

  <button id="sound-button">🔊 タップして声を聞く</button>

  <div id="link-buttons">
    <img src="assets/images/icon_hp.png"
         onclick="window.open('https://d-dizain.com/digital-shop/ar-card/', '_blank')">
    <img src="assets/images/icon_fb.png"
         onclick="window.open('https://www.facebook.com/kiyomi.dake', '_blank')">
    <img src="assets/images/icon_line.png"
         onclick="window.open('https://lin.ee/9J4t8yS', '_blank')">
  </div>

  <div id="debug">init</div>

  <a-scene mindar-image="imageTargetSrc: assets/targets.mind;"
           color-space="sRGB"
           renderer="colorManagement:true"
           vr-mode-ui="enabled:false"
           device-orientation-permission-ui="enabled:false">

    <a-assets timeout="3000">
      <video id="video"
             src="assets/videos/dake.mp4"
             preload="auto"
             muted
             loop
             playsinline
             webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <a-entity mindar-image-target="targetIndex:0"
              id="card-target"
              scale="2 2 2">
      <a-video id="ar-video"
               src="#video"
               width="1"
               height="1.8"
               position="0 0 0.001"></a-video>
    </a-entity>

  </a-scene>

  <script>
    const sceneEl  = document.querySelector('a-scene');
    const target   = document.querySelector('#card-target');
    const video    = document.querySelector('#video');
    const links    = document.querySelector('#link-buttons');
    const soundBtn = document.querySelector('#sound-button');
    const loading  = document.querySelector('#loading');
    const dbg      = document.querySelector('#debug');

    const log = (m) => { dbg.textContent = m; console.log('[AR]', m); };

    // カメラとライブラリの準備完了でオーバーレイをフェードアウト
    sceneEl.addEventListener('arReady', () => {
      loading.classList.add('hide');
      setTimeout(() => { loading.style.display = 'none'; }, 400);
      log('arReady / readyState=' + video.readyState);
    });

    sceneEl.addEventListener('arError', () => {
      loading.querySelector('.msg').innerHTML =
        'カメラを起動できませんでした。<br>カメラの使用を許可して、<br>ページを再読み込みしてください。';
      log('arError');
    });

    let lostTimer = null;
    let awayConfirmed = true;   // 名刺が完全に外れている状態か

    target.addEventListener('targetFound', () => {
      clearTimeout(lostTimer);
      links.style.display = 'flex';

      // まだ音が許可されていなければボタンを出す
      if (video.muted) soundBtn.style.display = 'block';

      // 完全に外れていた場合だけ頭に戻す。
      // ちらつきで連続発火しても巻き戻さないので再生が途切れない
      if (awayConfirmed) {
        video.currentTime = 0;
        awayConfirmed = false;
      }

      video.play()
        .then(() => log('play OK / muted=' + video.muted))
        .catch(e  => log('play NG: ' + e.name));
    });

    target.addEventListener('targetLost', () => {
      clearTimeout(lostTimer);
      // 1秒待って本当に外れたときだけ停止する（巻き戻しはここではしない）
      lostTimer = setTimeout(() => {
        video.pause();
        awayConfirmed = true;
        links.style.display = 'none';
        soundBtn.style.display = 'none';
        log('targetLost 確定');
      }, 1000);
    });

    // 音声オン。頭から再生し直して挨拶の最初から聞かせる
    soundBtn.addEventListener('click', () => {
      video.muted = false;
      video.currentTime = 0;
      video.play();
      soundBtn.style.display = 'none';
      log('音オン / 頭から再生');
    });

    // 動画の読み込み状況を可視化（原因切り分け用）
    ['loadedmetadata','canplay','waiting','stalled','error']
      .forEach(ev => video.addEventListener(ev,
        () => log('video:' + ev + ' rs=' + video.readyState)));
  </script>

</body>
</html>

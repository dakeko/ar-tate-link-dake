<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR名刺</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; overflow: hidden; }
    #start-button {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      padding: 14px 24px;
      font-size: 20px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 16px;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-align: center;
      line-height: 1.6;
    }
    #link-buttons {
      position: fixed;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      display: none;
      gap: 20px;
      flex-direction: row;
    }
    #link-buttons img {
      width: 60px;
      height: 60px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <button id="start-button">タップして<br>ARをスタート</button>
  <div id="link-buttons">
    <img src="assets/images/icon_hp.png" onclick="window.open('https://d-dizain.com/digital-shop/ar-card/', '_blank')">
    <img src="assets/images/icon_fb.png" onclick="window.open('https://www.facebook.com/kiyomi.dake', '_blank')">
    <img src="assets/images/icon_line.png" onclick="window.open('https://lin.ee/9J4t8yS', '_blank')">
  </div>

  <a-scene mindar-image="imageTargetSrc: assets/targets.mind;"
           color-space="sRGB"
           renderer="colorManagement:true"
           vr-mode-ui="enabled:false"
           device-orientation-permission-ui="enabled:false">

    <a-assets>
      <video id="video"
             src="assets/videos/dake.mp4"
             preload="auto"
             playsinline
             webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <a-entity mindar-image-target="targetIndex:0"
              id="card-target"
              scale="2 2 2">
      <a-video id="ar-video"
               src="#video"
               width="1"
               height="1.8"
               position="0 0 0.001"></a-video>
      <a-text id="intro-line1" value="ダケキヨミです！" position="0 0.4 0.002" align="center" color="#FFFFFF" width="1.8"></a-text>
      <a-text id="intro-line2" value="WEBとAIで日々の作業を" position="0 0 0.002" align="center" color="#FFFFFF" width="1.8"></a-text>
      <a-text id="intro-line3" value="ラクにするお手伝いをします" position="0 -0.3 0.002" align="center" color="#FFFFFF" width="1.8"></a-text>
    </a-entity>

  </a-scene>

  <script>
    const target = document.querySelector('#card-target');
    const video = document.querySelector('#video');
    const btn = document.querySelector('#start-button');
    const linkButtons = document.querySelector('#link-buttons');
    const introLine1 = document.querySelector('#intro-line1');
    const introLine2 = document.querySelector('#intro-line2');
    const introLine3 = document.querySelector('#intro-line3');

    btn.addEventListener('click', () => {
      btn.style.display = 'none';
    });

    target.addEventListener('targetFound', () => {
      video.play();
      linkButtons.style.display = 'flex';
    });

    video.addEventListener('playing', () => {
      introLine1.setAttribute('visible', false);
      introLine2.setAttribute('visible', false);
      introLine3.setAttribute('visible', false);
    });

    target.addEventListener('targetLost', () => {
      video.pause();
      video.currentTime = 0;
      linkButtons.style.display = 'none';
      introLine1.setAttribute('visible', true);
      introLine2.setAttribute('visible', true);
      introLine3.setAttribute('visible', true);
    });
  </script>

</body>
</html>
